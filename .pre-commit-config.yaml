repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: .venv/bin/basedpyright
        language: system
        types: [python]
        pass_filenames: false
