# Lint and unit tests only. This workflow does not build an image or call live services.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: basedpyright
        run: .venv/bin/basedpyright

      - name: Tests
        env:
          # CI cannot create /var/log/ai; Django tests disable file logs the same way.
          LOG_FILE_PATH: ${{ runner.temp }}/ai/app.log
          ENVIRONMENT: development
        run: .venv/bin/python -m pytest -q
